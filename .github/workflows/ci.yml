name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project generator and search tool
        run: brew install xcodegen ripgrep

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate generated files and scripts
        run: |
          set -euo pipefail
          git diff --exit-code -- AIUsage.xcodeproj
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          bash scripts/check-localizations.sh
          plutil -lint App/Info.plist

          feed_url=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' App/Info.plist)
          public_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' App/Info.plist)
          verify_before_extraction=$(/usr/libexec/PlistBuddy -c 'Print :SUVerifyUpdateBeforeExtraction' App/Info.plist)
          require_signed_feed=$(/usr/libexec/PlistBuddy -c 'Print :SURequireSignedFeed' App/Info.plist)
          scheduled_interval=$(/usr/libexec/PlistBuddy -c 'Print :SUScheduledCheckInterval' App/Info.plist)
          test "$feed_url" = 'https://moritouch.com/ai-usage/appcast.xml'
          test "$public_key" = 'rUEpVqbT7U1FSjjuxv3WyP4Fqd1WFOqk/71V71fKKs0='
          test "$verify_before_extraction" = 'true'
          test "$require_signed_feed" = 'true'
          test "$scheduled_interval" = '86400'

          package_resolved=AIUsage.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f "$package_resolved"
          project_sparkle_version=$(awk '
            $1 == "Sparkle:" { in_sparkle = 1; next }
            in_sparkle && $1 == "exactVersion:" { print $2; exit }
          ' project.yml)
          test "$project_sparkle_version" = '2.9.6'
          jq -e '
            ([.pins[] | select(.identity == "sparkle")] | length) == 1
            and any(
              .pins[];
              .identity == "sparkle"
              and .kind == "remoteSourceControl"
              and .location == "https://github.com/sparkle-project/Sparkle"
              and .state.version == "2.9.6"
              and .state.revision == "ac2def288cbff5cfc7df3ffef6abdf45b72bcb0a"
            )
          ' "$package_resolved" >/dev/null

          test ! -e .github/workflows/pages.yml
          rg -F '<link rel="canonical" href="https://moritouch.com/ai-usage">' docs/index.html
          test -s LICENSE
          rg -F 'MIT License' LICENSE
          if rg -n 'arrow\.uturn\.backward|Restore automatic card order' App/UsagePopoverView.swift; then
            echo 'The removed header restore button was reintroduced.' >&2
            exit 1
          fi
          if rg -n 'stalenessText|observedRelativeText|Text\("Updated ' App Widget; then
            echo 'Per-card observation age text was reintroduced.' >&2
            exit 1
          fi
          perl -CSDA -ne '
            if (/\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]/) {
              print "$ARGV:$.:$_";
              $invalid = 1;
            }
            close ARGV if eof;
            END { exit($invalid ? 1 : 0) }
          ' scripts/*.sh
          ./scripts/release.sh --help >/dev/null
          ./scripts/prepare-appcast.sh --help >/dev/null
          ./scripts/test-prepare-appcast-staging.sh
          rg -F 'PUBLIC_DOWNLOAD_BASE="$PRODUCT_URL/releases"' scripts/prepare-appcast.sh
          rg -F -- '--download-url-prefix "$PUBLIC_DOWNLOAD_BASE/$TAG/"' scripts/prepare-appcast.sh
          if rg -F 'download-url-prefix "https://github.com/' scripts/prepare-appcast.sh; then
            echo 'Sparkle enclosure downloads must not point at the private GitHub repository.' >&2
            exit 1
          fi
          node --check docs/site.js

      - name: Unit tests
        run: >-
          xcodebuild
          -project AIUsage.xcodeproj
          -scheme AIUsage
          -configuration Debug
          -packageAuthorizationProvider netrc
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Build with strict concurrency checks
        run: >-
          xcodebuild
          -project AIUsage.xcodeproj
          -scheme AIUsage
          -configuration Debug
          -packageAuthorizationProvider netrc
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Static analyzer
        run: >-
          xcodebuild
          -project AIUsage.xcodeproj
          -scheme AIUsage
          -configuration Debug
          -packageAuthorizationProvider netrc
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          analyze
